name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Strict Typecheck
        run: npm run typecheck

      - name: ESLint Code Quality Verification
        run: npm run lint

      - name: Prettier Code Style Verification
        run: npx prettier --check "src/**/*.{ts,css,json}"

      - name: Production ESBuild Bundle
        run: npm run build

      - name: Run Vitest Test Suites
        run: npm test

      - name: Verify Distribution Artifacts
        run: |
          test -f main.js
          test -f styles.css
          test -f manifest.json
